name: Build Container Images

on:
  push:
    tags:
      - "image/v*"
    paths-ignore:
      - "charts/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "charts/**"
env:
  IMAGES: docker.io/hapiproject/hapi
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64/v8

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check if PR is from the same repo (not a fork)
        id: same_repo
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "push_ghcr=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_ghcr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set GHCR image name
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Container meta for default (distroless) image
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=match,pattern=image/(.*),group=1,enable=${{github.event_name != 'pull_request'}}


      - name: Container meta for GHCR default (distroless) image
        id: docker_ghcr_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=pr,enable=${{ steps.same_repo.outputs.push_ghcr == 'true' }}

      - name: Container meta for tomcat image
        id: docker_tomcat_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=match,pattern=image/(.*),group=1,enable=${{github.event_name != 'pull_request'}}
          flavor: |
            suffix=-tomcat,onlatest=true

      - name: Container meta for GHCR tomcat image
        id: docker_ghcr_tomcat_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=pr,enable=${{ steps.same_repo.outputs.push_ghcr == 'true' }}
          flavor: |
            suffix=-tomcat,onlatest=true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        if: steps.same_repo.outputs.push_ghcr == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push default (distroless) image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          push: ${{ github.event_name != 'pull_request' || steps.same_repo.outputs.push_ghcr == 'true' }}
          tags: |
            ${{ steps.docker_meta.outputs.tags }}
            ${{ steps.docker_ghcr_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}
          target: default

      - name: Build and push tomcat image
        id: docker_build_tomcat
        uses: docker/build-push-action@v5
        with:
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          push: ${{ github.event_name != 'pull_request' || steps.same_repo.outputs.push_ghcr == 'true' }}
          tags: |
            ${{ steps.docker_tomcat_meta.outputs.tags }}
            ${{ steps.docker_ghcr_tomcat_meta.outputs.tags }}
          labels: ${{ steps.docker_tomcat_meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}
          target: tomcat
